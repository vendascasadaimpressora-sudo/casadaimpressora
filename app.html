<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1E35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CI Locação">
<title>Casa da Impressora — App Locação</title>
<style>
:root{
  --bg:#F3F5F9;--card:#fff;--tx:#1B2433;--tx2:#5B6679;--tx3:#8A94A6;--bd:#E3E7EE;
  --navy:#0F1E35;--or:#E8680A;--red:#E5455A;--gre:#26A86B;--pur:#7D52CC;--blu:#2F7FE0;--teal:#17808C;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.4;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 13px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--or)}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}

/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
.top .back{background:rgba(255,255,255,.14);color:#fff;width:38px;height:38px;border-radius:12px;font-size:20px;flex-shrink:0}
.top h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .act{background:var(--or);color:#fff;padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px;flex-shrink:0}
.wrap{padding:14px;max-width:760px;margin:0 auto}

/* home */
.hero{background:linear-gradient(135deg,#0F1E35,#1D3557);color:#fff;border-radius:0 0 26px 26px;padding:6px 18px 22px;padding-top:calc(18px + env(safe-area-inset-top))}
.hero .brand{display:flex;align-items:center;gap:12px}
.hero .logo{width:46px;height:46px;border-radius:14px;background:var(--or);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px}
.hero h2{font-size:19px;font-weight:800;line-height:1.15}
.hero p{font-size:12.5px;color:#B9C4D6;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:11px;color:#B9C4D6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 14px 6px;max-width:760px;margin:0 auto}
.tile{border-radius:20px;color:#fff;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:118px;font-weight:700;font-size:15px;box-shadow:0 6px 16px rgba(15,30,53,.14);transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:34px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.tile small{font-weight:500;font-size:11.5px;opacity:.9;margin-top:-4px}
.t-red{background:linear-gradient(160deg,#F0566B,#D93A50)}
.t-or{background:linear-gradient(160deg,#F7923C,#E8680A)}
.t-gre{background:linear-gradient(160deg,#35BD7D,#1F9A5F)}
.t-pur{background:linear-gradient(160deg,#9166DA,#6F43BC)}
.t-blu{background:linear-gradient(160deg,#4A93EE,#2A6FD0)}
.t-teal{background:linear-gradient(160deg,#27939F,#136C77)}
.sec{font-size:15px;font-weight:800;margin:18px 14px 8px;display:flex;justify-content:space-between;max-width:760px;margin-left:auto;margin-right:auto;padding:0 14px}

/* listas */
.search{position:sticky;top:62px;z-index:10;background:var(--bg);padding:10px 0 8px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:99px;background:#fff;border:1.5px solid var(--bd);font-weight:600;font-size:13px;color:var(--tx2)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.item{background:var(--card);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;box-shadow:0 1px 3px rgba(15,30,53,.07);border:1px solid var(--bd)}
.item.tap{cursor:pointer}.item.tap:active{background:#FAFBFD}
.item .t{font-weight:700;font-size:15px;word-break:break-word}
.item .s{font-size:13px;color:var(--tx2);margin-top:2px;word-break:break-word}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1;min-width:0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:6px;vertical-align:middle}
.b-gre{background:#DDF5E9;color:#12774A}.b-or{background:#FFE9D6;color:#B24E00}.b-red{background:#FDE0E4;color:#B3243A}.b-blu{background:#DDEBFD;color:#1C57A8}.b-gr{background:#ECEFF4;color:#566177}
.money{font-weight:800;color:var(--or);white-space:nowrap}
.empty{text-align:center;color:var(--tx3);padding:34px 14px}
.empty b{display:block;font-size:34px;margin-bottom:6px}

/* botões de ação */
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.acts.three{grid-template-columns:repeat(3,1fr)}
.ab{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 8px;border-radius:13px;color:#fff;font-weight:700;font-size:14px;text-decoration:none;text-align:center}
.ab:active{filter:brightness(.92)}
.ab.maps{background:#2F7FE0}.ab.waze{background:#12B6D6}.ab.wa{background:#25B561}.ab.tel{background:#7D52CC}.ab.mail{background:#E8680A}.ab.gry{background:#E9ECF2;color:var(--tx)}.ab.red{background:#FDE0E4;color:#B3243A}.ab.navy{background:var(--navy)}
.box{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--bd);box-shadow:0 1px 3px rgba(15,30,53,.06)}
.box h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #F0F2F6;font-size:14px}
.kv:last-child{border-bottom:none}.kv span:first-child{color:var(--tx2);flex-shrink:0}.kv span:last-child{text-align:right;font-weight:600;word-break:break-word}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--or);color:#fff;font-weight:800;font-size:16px;margin-top:16px}
.btn.sec2{background:#E9ECF2;color:var(--tx);margin-top:10px}
.btn.dan{background:#FDE0E4;color:#B3243A;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:40px;height:40px;border-radius:12px;background:#E9ECF2;font-size:22px;font-weight:700;color:var(--tx)}
.qty button.p{background:var(--gre);color:#fff}
.qty b{min-width:34px;text-align:center;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1B2433;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:99;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hint{font-size:12.5px;color:var(--tx3);margin-top:5px}
.warn{background:#FFF6E5;border:1px solid #F5D9A0;color:#7A5200;border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:12px}
.hid{display:none!important}
.alerta{display:flex;align-items:center;gap:12px;margin:14px 14px 0;max-width:760px;padding:14px 16px;border-radius:18px;color:#fff;font-weight:700;text-align:left;width:calc(100% - 28px);box-shadow:0 6px 16px rgba(15,30,53,.16)}
.alerta .ic{font-size:30px}
.alerta small{display:block;font-weight:500;font-size:12.5px;opacity:.95;margin-top:2px}
.alerta.ruim{background:linear-gradient(135deg,#E5455A,#C42C45)}
.alerta.ok{background:linear-gradient(135deg,#35BD7D,#1F9A5F)}
.alerta .n{margin-left:auto;background:rgba(255,255,255,.25);border-radius:99px;padding:4px 12px;font-size:18px}
.sech{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sech .n{background:var(--navy);color:#fff;border-radius:99px;padding:1px 9px;font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px}
.parc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F2F6}
.parc:last-child{border-bottom:none}
.parc .sp b{display:block;font-size:14px}.parc .sp span{font-size:12.5px;color:var(--tx2)}
.mini{padding:9px 13px;border-radius:11px;font-weight:700;font-size:13px;background:var(--gre);color:#fff}
.mini.off{background:#E9ECF2;color:var(--tx2)}

</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hid">

<script>
/* ============ DADOS (guardados só neste aparelho, chave própria cdi_app_v1) ============ */
var KEY='cdi_app_v1';
var D={clientes:[],comodato:[],equipamentos:[],estoque:[],meta:{}};
var pilha=[]; var atual={v:'home',p:null};

function carregar(){
  try{ var r=localStorage.getItem(KEY); if(r){ var o=JSON.parse(r); ['clientes','comodato','equipamentos','estoque'].forEach(function(k){ D[k]=Array.isArray(o[k])?o[k]:[]; }); D.meta=(o.meta&&typeof o.meta==='object')?o.meta:{}; } }catch(e){}
  if(!D.meta.desde){ D.meta.desde=ymDe(new Date()); salvar(); }
}
function salvar(){
  try{ localStorage.setItem(KEY,JSON.stringify(D)); return true; }
  catch(e){ aviso('⚠️ Não consegui salvar (memória cheia). Baixe um backup!'); return false; }
}
function aviso(t){
  var el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el);
  setTimeout(function(){ el.remove(); },2600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function dig(s){ return String(s||'').replace(/\D/g,''); }
function brl(n){ n=parseFloat(String(n==null?'':n).replace(',','.')); if(isNaN(n)) n=0; return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }

/* ============ ENDEREÇOS → WAZE / GOOGLE MAPS ============ */
function endCad(c){
  var l1=[c.endereco, c.numero, c.complemento].filter(Boolean).join(', ');
  var l2=[c.bairro, (c.cidade&&c.uf)?c.cidade+' - '+c.uf:(c.cidade||c.uf||'')].filter(Boolean).join(', ');
  var cep=c.cep?('CEP '+c.cep):'';
  return {linha:[l1,l2,cep].filter(Boolean).join(' — '),
          busca:[c.endereco, c.numero, c.bairro, c.cidade, c.uf, c.cep, 'Brasil'].filter(Boolean).join(', '),
          ok: !!(c.endereco||c.cep)};
}
function endInst(c){
  var e=c.endInstalacao; if(!e||c.instMesmoEnd!==false) return null;
  if(!(e.end||e.cep)) return null;
  var l1=[e.end,e.num,e.comp].filter(Boolean).join(', ');
  var l2=[e.bai,(e.cid&&e.uf)?e.cid+' - '+e.uf:(e.cid||e.uf||'')].filter(Boolean).join(', ');
  return {linha:[l1,l2,e.cep?('CEP '+e.cep):''].filter(Boolean).join(' — '),
          busca:[e.end,e.num,e.bai,e.cid,e.uf,e.cep,'Brasil'].filter(Boolean).join(', '), obs:e.obs||''};
}
function urlMaps(q){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q)+'&travelmode=driving'; }
function urlWaze(q){ return 'https://waze.com/ul?q='+encodeURIComponent(q)+'&navigate=yes'; }
function urlWa(tel,msg){ var d=dig(tel); if(d.length<=11) d='55'+d; return 'https://wa.me/'+d+(msg?'?text='+encodeURIComponent(msg):''); }
function botoesEnd(busca){
  return '<div class="acts"><a class="ab maps" target="_blank" rel="noopener" href="'+urlMaps(busca)+'">📍 Google Maps</a>'+
         '<a class="ab waze" target="_blank" rel="noopener" href="'+urlWaze(busca)+'">🚗 Waze</a></div>';
}

/* ============ LIGAÇÕES CONTRATO ↔ CLIENTE ============ */
function acharCliente(nome){
  var n=norm(nome); if(!n) return -1;
  var i=D.clientes.findIndex(function(c){return norm(c.nome)===n;});
  if(i<0) i=D.clientes.findIndex(function(c){return c.fantasia && norm(c.fantasia)===n;});
  return i;
}
function itensContrato(c){
  if(Array.isArray(c.itens)&&c.itens.length) return c.itens.map(function(i){return {equip:i.equip||i.descricao||'',qtd:i.qtd||1,valor:i.valor||0};});
  return c.equip?[{equip:c.equip,qtd:1,valor:c.valor||0}]:[];
}
function contratosDoCliente(nome){
  var n=norm(nome); return D.comodato.map(function(c,i){return {c:c,i:i};}).filter(function(x){return norm(x.c.cliente)===n;});
}

/* ============ NAVEGAÇÃO ============ */
function go(v,p,semPilha){
  if(!semPilha) pilha.push(atual);
  atual={v:v,p:(p===undefined?null:p)};
  desenhar(); window.scrollTo(0,0);
}
function voltar(){ if(pilha.length){ atual=pilha.pop(); desenhar(); } else { atual={v:'home',p:null}; desenhar(); } }
function topo(titulo,acao){
  return '<div class="top"><button class="back" onclick="voltar()">←</button><h1>'+esc(titulo)+'</h1>'+(acao||'')+'</div>';
}
function desenhar(){
  var f={home:vHome,clientes:vClientes,cliente:vCliente,cliForm:vCliForm,locacao:vLocacao,contrato:vContrato,locForm:vLocForm,
         avisos:vAvisos,equip:vEquip,eqForm:vEqForm,estoque:vEstoque,prodForm:vProdForm,rotas:vRotas,dados:vDados}[atual.v]||vHome;
  document.getElementById('app').innerHTML=f(atual.p);
  if(f.pos) f.pos();
}


/* ============ AVISOS: TÉRMINO DE CONTRATO E PARCELAS EM ATRASO ============ */
function pad2(n){ return (n<10?'0':'')+n; }
function ymDe(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function hojeZ(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function isoDe(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function dataIso(s){ var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function fData(d){ return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear(); }
function fMes(ym){ var n=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; var p=ym.split('-'); return n[+p[1]-1]+'/'+p[0]; }
function diaVenc(c){ var m=String(c.venc||'').match(/\d{1,2}/); var n=m?parseInt(m[0]):0; return (n>=1&&n<=31)?n:0; }
function difDias(a,b){ return Math.round((a-b)/86400000); }

/* parcelas mensais do contrato, de "cobrança desde" até o mês atual */
function parcelasDe(c){
  var dv=diaVenc(c); if(!dv) return [];
  var desde=/^\d{4}-\d{2}$/.test(c.cobrancaDesde||'')?c.cobrancaDesde:(D.meta.desde||ymDe(new Date()));
  var y=+desde.slice(0,4), m=+desde.slice(5,7);
  var hoje=hojeZ(), cy=hoje.getFullYear(), cm=hoje.getMonth()+1, out=[];
  if((cy*12+cm)-(y*12+m)>24){ var t=cy*12+cm-24; y=Math.floor((t-1)/12); m=t-y*12; }
  while(y<cy||(y===cy&&m<=cm)){
    var ult=new Date(y,m,0).getDate(), due=new Date(y,m-1,Math.min(dv,ult)), ym=y+'-'+pad2(m);
    var pago=!!(c.pagos&&c.pagos[ym]);
    out.push({ym:ym,due:due,pago:pago,atraso:pago?0:difDias(hoje,due)});
    m++; if(m>12){m=1;y++;}
  }
  return out;
}
function statusFim(c){
  var fim=dataIso(c.fimContrato); if(!fim) return null;
  var d=difDias(fim,hojeZ());
  if(d<0) return {tipo:'vencido',dias:-d,fim:fim};
  if(d<=60) return {tipo:'vencendo',dias:d,fim:fim};
  return {tipo:'ok',dias:d,fim:fim};
}
function gerarAvisos(){
  var A={atrasos:[],proximas:[],vencidos:[],vencendo:[],semFim:0};
  D.comodato.forEach(function(c,i){
    parcelasDe(c).forEach(function(p){
      if(p.pago) return;
      if(p.atraso>=1) A.atrasos.push({i:i,c:c,ym:p.ym,due:p.due,dias:p.atraso});
      else if(p.atraso>=-5) A.proximas.push({i:i,c:c,ym:p.ym,due:p.due,dias:-p.atraso});
    });
    var s=statusFim(c);
    if(!s) A.semFim++;
    else if(s.tipo==='vencido') A.vencidos.push({i:i,c:c,dias:s.dias,fim:s.fim});
    else if(s.tipo==='vencendo') A.vencendo.push({i:i,c:c,dias:s.dias,fim:s.fim});
  });
  A.atrasos.sort(function(a,b){return b.dias-a.dias;});
  A.proximas.sort(function(a,b){return a.dias-b.dias;});
  A.vencidos.sort(function(a,b){return b.dias-a.dias;});
  A.vencendo.sort(function(a,b){return a.dias-b.dias;});
  return A;
}
function totalAvisos(A){ return A.atrasos.length+A.vencidos.length+A.vencendo.length; }
function resumoContrato(c){ var its=itensContrato(c); return its.map(function(i){return (i.qtd>1?i.qtd+'x ':'')+i.equip;}).join(' + ')||'Contrato'; }
function pagar(i,ym,v){
  var c=D.comodato[i]; if(!c) return; c.pagos=c.pagos||{};
  if(c.pagos[ym]) delete c.pagos[ym]; else c.pagos[ym]=isoDe(new Date());
  salvar(); aviso(c.pagos[ym]?'✓ Marcado como pago':'Pagamento desmarcado');
  var y=window.scrollY; desenhar(); window.scrollTo(0,y);
}
function msgCobranca(c,due){
  return 'Olá! Aqui é da Casa da Impressora. Identificamos que a mensalidade da locação ('+resumoContrato(c)+') com vencimento em '+fData(due)+', no valor de '+brl(c.valor)+', consta em aberto. Pode nos confirmar o pagamento? Se já pagou, desconsidere. Obrigado!';
}
function msgRenovacao(c,fim,dias){
  return 'Olá! Aqui é da Casa da Impressora. O contrato de locação ('+resumoContrato(c)+') '+(dias<0?'venceu':'vence')+' em '+fData(fim)+'. Gostaria de conversar sobre a renovação?';
}
function botoesContato(c,msg){
  var ci=acharCliente(c.cliente), t=ci>=0?(D.clientes[ci].tel1||D.clientes[ci].tel2||''):'';
  if(!t) return '';
  return '<div class="acts"><a class="ab tel" href="tel:'+dig(t)+'">📞 Ligar</a><a class="ab wa" target="_blank" rel="noopener" href="'+urlWa(t,msg)+'">💬 WhatsApp</a></div>';
}
function vAvisos(){
  var A=gerarAvisos(), h=topo('Avisos');
  h+='<div class="wrap">';
  if(!totalAvisos(A)&&!A.proximas.length) h+='<div class="empty"><b>✅</b>Tudo em dia! Nenhuma parcela em atraso e nenhum contrato vencendo.</div>';
  h+='<div class="hint" style="margin-bottom:4px">Parcelas contadas a partir de '+fMes(D.meta.desde)+' (ou da data de cobrança de cada contrato). Marque ✓ Pago para sumir do aviso.</div>';
  // atrasos
  h+='<div class="sech" style="color:#B3243A">🔴 Parcelas em atraso <span class="n">'+A.atrasos.length+'</span></div>';
  if(!A.atrasos.length) h+='<div class="s" style="color:var(--tx3);margin:0 2px 6px">Nenhuma parcela em atraso.</div>';
  A.atrasos.slice(0,80).forEach(function(x){

function buscaCep(p){
  var v=dig(document.getElementById(p+'-cep').value); if(v.length!==8) return;
  fetch('https://viacep.com.br/ws/'+v+'/json/').then(function(r){return r.json();}).then(function(d){
    if(!d||d.erro) return;
    var set=function(id,val){var e=document.getElementById(id); if(e&&val&&!e.value) e.value=val;};
    if(p==='f'){ set('f-end',d.logradouro); set('f-bai',d.bairro); set('f-cid',d.localidade); set('f-uf',d.uf); }
    else { set('i-end',d.logradouro); set('i-bai',d.bairro); set('i-cid',d.localidade); set('i-uf',d.uf); }
  }).catch(function(){});
}

function listaRo(){
  var q=norm(fRo.q), comLoc={};

  var arr=[];
  D.clientes.forEach(function(c,i){
    if(fRo.so==='loc' && !comLoc[norm(c.nome)]) return;
    var ins=endInst(c), e=endCad(c);

    if(!alvo) return;

    arr.push({c:c,i:i,a:alvo});
  });
  arr.sort(function(a,b){return norm(a.c.nome)<norm(b.c.nome)?-1:1;});
  var el=document.getElementById('lista'); if(!el) return;
  if(!arr.length){ el.innerHTML='<div class="empty"><b>🗺️</b>Nenhum cliente com endereço'+(fRo.so==='loc'?' e locação':'')+'</div>'; return; }

      (tem?'<button class="btn" style="margin-top:0;background:var(--teal)" onclick="importaCRM()">⬇️ Importar do sistema (neste navegador)</button><div class="hint">Lê os dados do sistema Casa da Impressora que já está aberto neste navegador. Não altera nada nele.</div>':'<div class="hint" style="margin:0 0 8px">O sistema principal não foi encontrado neste navegador. Use o arquivo de backup abaixo.</div>')+
      '<button class="btn sec2" onclick="pedeArquivo(\'crm\')">📁 Importar de arquivo de backup do sistema (.json)</button></div>'+
    '<div class="box"><h3>2. Backup deste app</h3><button class="btn" style="margin-top:0;background:var(--navy)" onclick="baixaBackup()">💾 Baixar backup do app</button><button class="btn sec2" onclick="pedeArquivo(\'app\')">📁 Restaurar backup do app</button></div>'+
    '<div class="box"><h3>Zona de cuidado</h3><button class="btn dan" style="margin-top:0" onclick="limpaTudo()">🗑️ Apagar todos os dados do app</button></div></div>';
  return h;
}
function resumoImport(o){
  var n=function(k){return Array.isArray(o[k])?o[k].length:0;};
  return n('clientes')+' clientes, '+n('comodato')+' contratos, '+n('equipamentos')+' equipamentos, '+n('estoque')+' produtos';
}
function aplicaImport(o,origem){
  if(!o||typeof o!=='object'||!(Array.isArray(o.clientes)||Array.isArray(o.comodato)||Array.isArray(o.equipamentos)||Array.isArray(o.estoque))){ aviso('Esse arquivo não parece um backup válido'); return; }
  if(!confirm('Importar '+resumoImport(o)+'?\n\nIsso SUBSTITUI os dados de hoje no app.\n(Pagamentos e datas de término já marcados nos contratos são mantidos.)')) return;
  var sem=function(a){return (a||[]).map(function(x){var y=Object.assign({},x); delete y.foto; delete y.fotos; delete y.logo; return y;});};
  var chave=function(c){return norm(c.cliente)+'|'+(c.seq||'')+'|'+norm(c.equip);};
  var antigos={}; D.comodato.forEach(function(c){ antigos[chave(c)]=c; });
  var novos=sem(o.comodato).map(function(c){
    var ant=antigos[chave(c)];
    if(ant&&origem==='crm'){ ['pagos','inicioContrato','fimContrato','cobrancaDesde'].forEach(function(k){ if(ant[k]!==undefined&&ant[k]!=='') c[k]=ant[k]; }); }
    if(!c.fimContrato){ // tenta descobrir pelo último aditivo de prazo do sistema
      var ad=(c.aditivos||[]).filter(function(a){return a&&/^\d{4}-\d{2}-\d{2}$/.test(a.prazoFim||'');}).map(function(a){return a.prazoFim;}).sort().pop();
      if(ad) c.fimContrato=ad;
    }
    if(!c.inicioContrato){ var di=c.dataInicio||c.dataContrato; if(/^\d{4}-\d{2}-\d{2}$/.test(di||'')) c.inicioContrato=di; }
    delete c.leituras; delete c.aditivos; delete c.obsGerais;
    return c;
  });
  if(origem==='app'&&o.meta&&o.meta.desde) D.meta=o.meta;
  D.clientes=sem(o.clientes); D.comodato=novos; D.equipamentos=sem(o.equipamentos); D.estoque=sem(o.estoque);
  if(salvar()){ aviso('✓ Importado: '+resumoImport(D)); atual={v:'home',p:null}; pilha=[]; desenhar(); }
}
function importaCRM(){
  try{ var o=JSON.parse(localStorage.getItem('cdi_v3')); aplicaImport(o,'crm'); }catch(e){ aviso('Não consegui ler os dados do sistema'); }
}
var _modoArq='crm';
function pedeArquivo(m){ _modoArq=m; var f=document.getElementById('fileIn'); f.value=''; f.click(); }
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('fileIn').addEventListener('change',function(ev){
    var arq=ev.target.files&&ev.target.files[0]; if(!arq) return;
    var r=new FileReader();
    r.onload=function(){ try{ aplicaImport(JSON.parse(r.result),_modoArq); }catch(e){ aviso('Arquivo inválido'); } };
    r.readAsText(arq);
  });
});
function baixaBackup(){
  var d=new Date(), z=function(x){return String(x).padStart(2,'0');};
  var nome='backup_app_locacao_'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'_'+z(d.getHours())+'h'+z(d.getMinutes())+'.json';
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'})); a.download=nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  aviso('✓ Backup baixado');
}
function limpaTudo(){
  if(!confirm('Apagar TODOS os dados do app neste aparelho?\n(O sistema principal não é afetado.)')) return;
  if(!confirm('Tem certeza? Baixe um backup antes se tiver dúvida.')) return;
  D={clientes:[],comodato:[],equipamentos:[],estoque:[],meta:{desde:ymDe(new Date())}}; salvar(); atual={v:'home',p:null}; pilha=[]; desenhar(); aviso('Dados do app apagados');
}

/* ============ INÍCIO ============ */
carregar();
document.addEventListener('DOMContentLoaded',desenhar);
window.addEventListener('popstate',function(){ voltar(); });
</script>
